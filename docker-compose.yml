services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEBAPP_PORT:-8080}:8080"
      - "${HTTPS_WEBAPP_PORT:-8443}:8443"
    # Rootless Podman's default DNS auto-detection here forwards to the host's systemd-resolved
    # loopback stub (127.0.0.53), which is unreachable from the container's own network namespace,
    # so hostname lookups (e.g. NuGet restore) hang and time out even though outbound connectivity
    # itself works. Pointing at public resolvers directly avoids the broken auto-detected upstream.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - type: bind
        source: ${PERENE_ARCHIVE_ROOT:-/home/PereneArchive}
        target: /archive
        read_only: false
      - thumbnail_cache:/previews
      - ./:/workspace
      - /workspace/WebApp/WebApp/bin
      - /workspace/WebApp/WebApp/obj
      - /workspace/WebApp/WebApp.Client/bin
      - /workspace/WebApp/WebApp.Client/obj
      - /workspace/WebApp.Tests/bin
      - /workspace/WebApp.Tests/obj
      - nuget_cache:/root/.nuget/packages
      # Read-only access to the host's Docker Engine API, used only to list/inspect sibling
      # containers and read their stats for the System Dashboard's Docker card (FR9). The
      # dashboard never starts, stops, or execs into a container through this socket.
      # Defaults to the standard Docker path; set DASHBOARD_DOCKER_SOCKET in .env to override
      # (for example, a rootless Podman socket at /run/user/<uid>/podman/podman.sock).
      - type: bind
        source: ${DASHBOARD_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
      # Optional self-signed HTTPS certificate material generated by `make https-cert`.
      # Read-only; absent by default, in which case Kestrel stays HTTP-only (see FR4).
      - type: bind
        source: ./https
        target: /https
        read_only: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
      ArchiveRoot__Path: /archive
      VideoLibrary__Path: /archive/Videos
      ThumbnailCache__Path: /previews
      VideoCut__Path: /archive/Videos/Cuts
      VideoComposition__Path: /archive/Videos/VideoComposition
      AllowedNetworkHosts__Hosts: ${ALLOWED_NETWORK_HOSTS:-}
      # Path is only set once a certificate password is configured, so an operator who never
      # runs `make https-cert` sees HttpsCertificate:Path unset (the explicit "not opted in" state).
      HttpsCertificate__Path: ${HTTPS_CERT_PASSWORD:+/https/perene.pfx}
      HttpsCertificate__Password: ${HTTPS_CERT_PASSWORD:-}
      HttpsCertificate__Port: "8443"
      # Read directly by scripts/generate-https-cert.sh (make https-cert); not consumed by the
      # app itself, which only ever reads the HttpsCertificate__* values above.
      HTTPS_SAN_HOSTS: ${HTTPS_SAN_HOSTS:-}
      HTTPS_CERT_PASSWORD: ${HTTPS_CERT_PASSWORD:-}
      # Optional: set to "false" to disable hover-preview generation and serving entirely.
      # HoverPreview__Enabled: "true"

volumes:
  nuget_cache:
  thumbnail_cache:
