services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    # See docker-compose.yml: rootless Podman's auto-detected DNS upstream (the host's
    # systemd-resolved loopback stub) is unreachable from the container's netns, so hostname
    # lookups hang. Point at public resolvers directly instead.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ThumbnailCache__Path: /previews
      Database__Path: /appdata/perene.db
      # Optional: set to "false" to disable hover-preview generation and serving entirely.
      # HoverPreview__Enabled: "true"
    volumes:
      - ./:/workspace
      - /workspace/WebApp/WebApp/bin
      - /workspace/WebApp/WebApp/obj
      - /workspace/WebApp/WebApp.Client/bin
      - /workspace/WebApp/WebApp.Client/obj
      - /workspace/WebApp.Tests/bin
      - /workspace/WebApp.Tests/obj
      - test_nuget_cache:/root/.nuget/packages
      - test_thumbnail_cache:/previews
      - test_appdata:/appdata
    command:
      - sh
      - -lc
      - |
        dotnet restore PereneArchive.slnx &&
        dotnet test WebApp.Tests/WebApp.Tests.csproj --no-restore --logger "console;verbosity=minimal"

volumes:
  test_nuget_cache:
  test_thumbnail_cache:
  test_appdata:
